[clear]
command:/usr/local/opnsense/scripts/csvspeedtest/clear.py
parameters:
type:script_output
message:Backup and clear LibreSpeed speedtest CSV log

[info]
command:/usr/local/opnsense/scripts/csvspeedtest/info.py
parameters:
type:script_output
message:Read installed LibreSpeed Speedtest CLI identity (no speed test)

[run]
command:/usr/local/opnsense/scripts/csvspeedtest/measure.sh
parameters:
type:script
message:Running official LibreSpeed Speedtest CSV measurement
description:Official LibreSpeed Speedtest CSV Logger

[servers_list]
command:/usr/local/opnsense/scripts/csvspeedtest/servers_list.py
parameters:
type:script_output
message:Fetch LibreSpeed server list (no measurement)

[servers_settings]
command:/usr/local/opnsense/scripts/csvspeedtest/settings_cli.py
parameters:
type:script_output
message:Read LibreSpeed server settings

[servers_save]
command:/usr/local/opnsense/scripts/csvspeedtest/settings_cli.py
parameters:%s
type:script_output
message:Save validated LibreSpeed server settings

[manual_start]
command:/usr/local/opnsense/scripts/csvspeedtest/manual_run.py
parameters:start
type:script_output
message:Start a one-time LibreSpeed speed test from WebGUI

[manual_status]
command:/usr/local/opnsense/scripts/csvspeedtest/manual_run.py
parameters:status
type:script_output
message:Read one-time LibreSpeed speed test status
