name: Publish LibreSpeed v0.5.4-L

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SHA256 release assets
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS.txt
      - name: Create GitHub release (once)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.5.4-L
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            release-assets/os-speedtest_0.5.4-L.pkg \
            release-assets/os-speedtest_0.5.4-L.tar.gz \
            release-assets/os-speedtest_0.5.4-L-source.zip \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "os-speedtest v0.5.4-L (LibreSpeed)" \
            --notes-file RELEASE_NOTES_DE_EN.md
